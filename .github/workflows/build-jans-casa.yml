name: Build jans-casa WAR

on:
  push:
    branches:
      - main
    paths:
      - 'jans-casa/**'
      - '.github/workflows/build-jans-casa.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build jans-casa
        run: |
          cd jans-casa
          mvn clean package -DskipTests -Dmaven.buildNumber.skip=true

      - name: Generate SHA256
        run: |
          echo "=== Todos los WAR generados ==="
          find . -name "*.war" 2>/dev/null

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jans-casa-${{ github.run_number }}
          name: "jans-casa build #${{ github.run_number }}"
          body: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: |
            jans-casa.war
            jans-casa.war.sha256
